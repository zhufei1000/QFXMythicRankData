name: Probe RaiderIO CN gear API (isolated no-secrets)

on:
  push:
    branches:
      - probe/raiderio-cn-gear-20261008
    paths:
      - .github/workflows/probe-raiderio-cn-gear-20261008.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify actual CN gear JSON and show item IDs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://raider.io/api/v1/characters/profile"
          cases = [
              ("CN-slug", "cn", "shadowfang-keep", "\u8d28\u91cf\u6709\u4fdd\u8bc1"),
              ("CN-localized", "cn", "\u5f71\u7259\u8981\u585e", "\u8d28\u91cf\u6709\u4fdd\u8bc1"),
              ("US-control", "us", "tichondrius", "Vesphorous"),
          ]
          for label, region, realm, name in cases:
              params = {"region": region, "realm": realm, "name": name, "fields": "gear"}
              url = base + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": "GearInspect-CN-Gear-Probe/1.0", "Accept":"application/json"})
              print("CASE", label, "region", region, "realm", realm, flush=True)
              try:
                  with urllib.request.urlopen(req, timeout=18) as resp:
                      status = resp.status
                      data = json.load(resp)
                  gear = data.get("gear") or {}
                  items = gear.get("items") or {}
                  if isinstance(items, dict):
                      rows = [(slot, val.get("item_id"), val.get("item_level")) for slot, val in items.items() if isinstance(val, dict)]
                  else:
                      rows = []
                  valid = [(slot, iid, ilvl) for slot, iid, ilvl in rows if isinstance(iid, int) and iid > 0]
                  print("HTTP", status, "gear_keys", list(gear.keys()), "total_slots", len(rows), "valid_item_ids", len(valid), "equipped_ilvl", gear.get("item_level_equipped"), flush=True)
                  print("FIRST_SLOTS", valid[:8], flush=True)
                  print("RESULT", label, "PASS" if valid else "FAIL_NO_ITEMID", flush=True)
              except urllib.error.HTTPError as exc:
                  print("HTTP", exc.code, "BODY", exc.read(300).decode("utf-8", errors="replace"), flush=True)
                  print("RESULT", label, "HTTP_ERROR", flush=True)
              except Exception as exc:
                  print("RESULT", label, "NETWORK_ERROR", repr(exc), flush=True)
          PY
