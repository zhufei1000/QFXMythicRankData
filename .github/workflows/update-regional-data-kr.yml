name: Update KR Regional Data

on:
  schedule:
    # KR 18:00 KST = 09:00 UTC (final daytime snapshot, ~2h after the 16:00 boundary)
    - cron: "0 9 * * *"
    # KR 06:00 KST = 21:00 UTC (final overnight snapshot, ~2h after the 04:00 boundary)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even when regional data is unchanged"
        required: true
        type: boolean
        default: false

jobs:
  update-kr:
    uses: ./.github/workflows/region-update-shared.yml
    with:
      region: KR
      force_publish: ${{ inputs.force_publish || false }}
    secrets: inherit
