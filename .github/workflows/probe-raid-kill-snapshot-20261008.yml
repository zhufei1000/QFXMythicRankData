name: Probe RaiderIO raid kill snapshot schema 2026

on:
  push:
    branches:
      - probe/raiderio-cn-gear-20261008
    paths:
      - .github/workflows/probe-raid-kill-snapshot-20261008.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public API schema (no scraping or login)
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"GearInspect-Authorized-APISchemaProbe/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=18) as r: return json.load(r)
          spec=get("https://raider.io/swagger.json")
          print("SWAGGER_VERSION",spec.get("info",{}).get("version"))
          paths=spec.get("paths") or {}
          for path in [
            "/api/v1/raiding/static-data",
            "/api/v1/raiding/raid-rankings",
            "/api/v1/live-tracking/guild/boss-pulls",
            "/api/v1/live-tracking/guild/raid-pulls",
            "/api/v1/live-tracking/guild/raid-comps",
            "/api/v1/live-tracking/character/loadout",
          ]:
              cfg=paths.get(path) or {}
              operation=cfg.get("get") or {}
              print("ENDPOINT",path,"parameters",[(p.get("name"),p.get("required"),p.get("type"),p.get("default")) for p in operation.get("parameters",[])],flush=True)
              print("DESCRIPTION",str(operation.get("summary") or operation.get("description") or "")[:180],flush=True)
              responses=operation.get("responses") or {}
              print("RESPONSE_SCHEMA",str((responses.get("200") or {}).get("schema") or "")[:160],flush=True)
          try:
              data=get("https://raider.io/api/v1/raiding/static-data?expansion_id=11")
              raids=data.get("raids") if isinstance(data,dict) else None
              print("STATIC_ROOT_KEYS",list(data)[:25],"RAID_COUNT",len(raids or []),flush=True)
              for raid in (raids or [])[-6:]:
                  print("RAID_META",{k:raid.get(k) for k in ("slug","name","id","tier","is_current")},flush=True)
          except Exception as e: print("STATIC_FAIL",repr(e)[:240])
          PY
