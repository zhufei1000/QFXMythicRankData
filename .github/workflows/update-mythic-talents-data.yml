name: Update QFX Talent Data

on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      wcl_max_pages:
        description: "Maximum WCL ranking pages scanned per boss/spec/difficulty"
        required: true
        type: string
        default: "5"
  push:
    branches:
      - main
    paths:
      - scripts/collect_mythicplus_talents.py
      - scripts/collect_raid_talents.py
      - scripts/build_talent_data.py
      - scripts/probe_raiderio_spec_dungeon_v2.py
      - scripts/probe_raiderio_spec_dungeon_v4.py
      - scripts/probe_wcl_raid_talents_v1.py
      - scripts/wcl_talent_export.py
      - scripts/talent_statistics.py
      - scripts/publish_talent_curseforge.py
      - scripts/templates/qfx_talent_data/**
      - tests/test_talent_data.py
      - tests/test_talent_statistics.py
      - tests/test_wcl_talent_export.py
      - tests/test_talent_curseforge_publish.py
      - config/mythic_talents_dungeons.json
      - config/mythic_talents_raids.json
      - .github/workflows/update-mythic-talents-data.yml
permissions:
  contents: write

concurrency:
  group: curseforge-talent-publish
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    if: github.actor != 'github-actions[bot]' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and Lua 5.1
        run: |
          python -m pip install --requirement requirements.txt
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Compile collectors and builder
        run: |
          python -m py_compile \
            scripts/collect_mythicplus_talents.py \
            scripts/collect_raid_talents.py \
            scripts/build_talent_data.py \
            scripts/probe_raiderio_spec_dungeon_v2.py \
            scripts/probe_raiderio_spec_dungeon_v4.py \
            scripts/probe_wcl_raid_talents_v1.py \
            scripts/wcl_talent_export.py \
            scripts/talent_statistics.py \
            scripts/publish_talent_curseforge.py

      - name: Collect ten global Mythic+ talent samples
        env:
          RAIDERIO_ACCESS_KEY: ${{ secrets.RAIDERIO_ACCESS_KEY }}
        run: python scripts/collect_mythicplus_talents.py

      - name: Check Warcraft Logs credentials
        id: wcl
        shell: bash
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          if [[ -n "${WCL_CLIENT_ID}" && -n "${WCL_CLIENT_SECRET}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::WCL credentials are missing; retaining Mythic+ data and omitting raid data for this run."
          fi

      - name: Collect original tier Heroic raid talents
        if: steps.wcl.outputs.available == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_TARGET: "10"
          WCL_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.wcl_max_pages || '5' }}
        run: |
          python scripts/collect_raid_talents.py \
            --zone 46 \
            --difficulty 4 \
            --output artifacts/wcl_tier_heroic.json \
            --markdown artifacts/wcl_tier_heroic.md \
            --checkpoint artifacts/wcl_tier_heroic_checkpoint.json

      - name: Collect original tier Mythic raid talents
        if: steps.wcl.outputs.available == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_TARGET: "10"
          WCL_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.wcl_max_pages || '5' }}
        run: |
          python scripts/collect_raid_talents.py \
            --zone 46 \
            --difficulty 5 \
            --output artifacts/wcl_tier_mythic.json \
            --markdown artifacts/wcl_tier_mythic.md \
            --checkpoint artifacts/wcl_tier_mythic_checkpoint.json

      - name: Collect Sporefall Heroic Rotmire talents
        if: steps.wcl.outputs.available == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_TARGET: "10"
          WCL_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.wcl_max_pages || '5' }}
        run: |
          python scripts/collect_raid_talents.py \
            --zone 50 \
            --difficulty 4 \
            --output artifacts/wcl_sporefall_heroic.json \
            --markdown artifacts/wcl_sporefall_heroic.md \
            --checkpoint artifacts/wcl_sporefall_heroic_checkpoint.json

      - name: Collect Sporefall Mythic Rotmire talents
        if: steps.wcl.outputs.available == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_TARGET: "10"
          WCL_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.wcl_max_pages || '5' }}
        run: |
          python scripts/collect_raid_talents.py \
            --zone 50 \
            --difficulty 5 \
            --output artifacts/wcl_sporefall_mythic.json \
            --markdown artifacts/wcl_sporefall_mythic.md \
            --checkpoint artifacts/wcl_sporefall_mythic_checkpoint.json

      - name: Generate unified QFXTalentData addon
        id: package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf QFXMythicTalents_Data
          python -c "import pathlib, sys; sys.path.insert(0, 'scripts'); from wcl_talent_export import TalentExporter; TalentExporter.download(cache_path=pathlib.Path('artifacts/raidbots_talents_live.json'))"
          raid_args=()
          for file in \
            artifacts/wcl_tier_heroic.json \
            artifacts/wcl_tier_mythic.json \
            artifacts/wcl_sporefall_heroic.json \
            artifacts/wcl_sporefall_mythic.json; do
            if [[ -f "${file}" ]]; then
              raid_args+=(--raid-input "${file}")
            fi
          done
          python scripts/build_talent_data.py \
            --input artifacts/raiderio_mainstream_talents_v4.json \
            "${raid_args[@]}" \
            --talent-trees artifacts/raidbots_talents_live.json \
            --output QFXTalentData \
            --zip "artifacts/QFXTalentData.zip"
          version="$(sed -n 's/^## Version: //p' QFXTalentData/QFXTalentData.toc)"
          if [[ ! "${version}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}\.[0-9]{2}$ ]]; then
            echo "Generated QFXTalentData version is invalid." >&2
            exit 1
          fi
          package="artifacts/QFXTalentData-${version}.zip"
          mv artifacts/QFXTalentData.zip "${package}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "path=${package}" >> "${GITHUB_OUTPUT}"

      - name: Validate generated database
        run: |
          python -m pytest -q tests/test_talent_data.py tests/test_talent_statistics.py tests/test_wcl_talent_export.py
          find QFXTalentData -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          unzip -t "${{ steps.package.outputs.path }}"
          test -f QFXTalentData/SpecLoaders.lua
          test ! -d QFXTalentData/Classes
          grep -q '\["selection"\]' QFXTalentData/SpecLoaders.lua
          ! grep -q '\["samples"\]' QFXTalentData/SpecLoaders.lua
          test "$(unzip -Z1 "${{ steps.package.outputs.path }}" | grep -c '^QFXTalentData/[^/]*$')" -eq 6
          grep -q 'slug="sporefall"' QFXTalentData/Common.lua
          grep -q 'id=3159' QFXTalentData/Common.lua

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/raiderio_mainstream_talents_v4.md ]]; then
            cat artifacts/raiderio_mainstream_talents_v4.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          for file in artifacts/wcl_tier_heroic.md artifacts/wcl_tier_mythic.md artifacts/wcl_sporefall_heroic.md artifacts/wcl_sporefall_mythic.md; do
            if [[ -f "${file}" ]]; then
              printf '\n' >> "${GITHUB_STEP_SUMMARY}"
              cat "${file}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          done
          if [[ -f QFXTalentData/README.md ]]; then
            printf '\n## Generated unified database\n\n' >> "${GITHUB_STEP_SUMMARY}"
            cat QFXTalentData/README.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Detect generated database changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- QFXTalentData
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "QFXTalentData is unchanged."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate QFXTalentData package for CurseForge
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_talent_curseforge.py \
            --artifact-file "${{ steps.package.outputs.path }}" \
            --mode validate \
            --changelog-file talent-publish-report/changelog.md \
            --report-file talent-publish-report/prepublish-validation.json \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-artifact-id 0 \
            --source-commit pending

      - name: Create the QFXTalentData commit locally
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        id: commit
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update QFXTalentData ${VERSION} with Sporefall [skip ci]"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Upload QFXTalentData package Artifact
        if: steps.changes.outputs.changed == 'true'
        id: packages
        uses: actions/upload-artifact@v4
        with:
          name: QFXTalentData-package-${{ github.run_id }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 5
          if-no-files-found: error

      - name: Upload QFXTalentData to CurseForge
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        id: curseforge
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/publish_talent_curseforge.py \
            --artifact-file "${{ steps.package.outputs.path }}" \
            --mode upload \
            --changelog-file talent-publish-report/changelog.md \
            --report-file talent-publish-report/report.json \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-artifact-id "${{ steps.packages.outputs.artifact-id }}" \
            --source-commit "${{ steps.commit.outputs.sha }}"

      - name: Upload safe QFXTalentData publishing report
        if: always() && steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: qfx-talent-curseforge-report-${{ github.run_id }}
          path: talent-publish-report/report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Push published QFXTalentData to main
        if: steps.changes.outputs.changed == 'true' && steps.curseforge.outcome == 'success' && github.ref == 'refs/heads/main'
        shell: bash
        run: git push origin HEAD:main

      - name: Upload database and source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qfx-talent-data-${{ github.run_id }}
          path: |
            artifacts/QFXTalentData-*.zip
            artifacts/raiderio_mainstream_talents_v4.json
            artifacts/raiderio_mainstream_talents_v4.md
            artifacts/raidbots_talents_live.json
            artifacts/wcl_tier_heroic.json
            artifacts/wcl_tier_heroic.md
            artifacts/wcl_tier_mythic.json
            artifacts/wcl_tier_mythic.md
            artifacts/wcl_sporefall_heroic.json
            artifacts/wcl_sporefall_heroic.md
            artifacts/wcl_sporefall_mythic.json
            artifacts/wcl_sporefall_mythic.md
          if-no-files-found: warn
          retention-days: 30
