name: Update Single Regional Data (shared)

on:
  workflow_call:
    inputs:
      region:
        required: true
        type: string
        description: "Region to update: CN, US, EU, TW, KR"
      force_publish:
        required: false
        type: boolean
        default: false
        description: "Publish selected packages even when regional data is unchanged"
    secrets:
      RAIDERIO_ACCESS_KEY:
        required: true
      CF_API_TOKEN:
        required: true

permissions:
  contents: write

# A single region runs alone: parallel regional updates can safely overlap,
# and retries are handled inside the commit/push step via rebase loops.
concurrency:
  group: regional-publish-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install Lua 5.1
        uses: ./.github/actions/setup-lua51

      - name: Verify shared Core.lua synchronization
        run: python scripts/sync_core.py --check

      - name: Fetch and validate ${{ inputs.region }} regional data
        id: fetch
        env:
          RAIDERIO_ACCESS_KEY: ${{ secrets.RAIDERIO_ACCESS_KEY }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          python scripts/update_region_data.py \
            --region "$(echo "${REGION}" | tr '[:upper:]' '[:lower:]')"

      - name: Detect publishable ${{ inputs.region }} data changes
        id: changes
        shell: bash
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          python scripts/detect_regional_data_changes.py \
            --base-ref HEAD \
            --regions "${REGION}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Resolve publishing scope
        id: publish_scope
        shell: bash
        env:
          DATA_CHANGED: ${{ steps.changes.outputs.changed }}
          CHANGED_REGIONS: ${{ steps.changes.outputs.changed_regions }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || false }}
          WORKFLOW_REF: ${{ github.ref }}
          PUBLISH_REF: refs/heads/main
        run: |
          set -euo pipefail
          python scripts/resolve_publish_scope.py --github-output "${GITHUB_OUTPUT}"

      - name: Run test suite against updated data
        if: steps.publish_scope.outputs.should_publish == 'true'
        env:
          LUA51: /usr/local/bin/lua
        run: python -m pytest -v

      - name: Validate updated Lua 5.1 syntax
        if: steps.publish_scope.outputs.should_publish == 'true'
        shell: bash
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          luac -p shared/Core.lua
          luac -p "QFXMythicRankData_${REGION}/Core.lua"
          luac -p "QFXMythicRankData_${REGION}/Data.lua"

      - name: Build installable ${{ inputs.region }} package
        if: steps.publish_scope.outputs.should_publish == 'true'
        shell: bash
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/build_packages.py --regions "$(echo "${REGION}" | tr '[:upper:]' '[:lower:]')"

      - name: Validate generated package offline
        if: steps.publish_scope.outputs.should_publish == 'true'
        shell: bash
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          python scripts/publish_curseforge_auto.py \
            --artifact-dir dist \
            --regions "$(echo "${REGION}" | tr '[:upper:]' '[:lower:]')" \
            --mode validate \
            --changelog-file publish-report/changelog.md \
            --report-file publish-report/prepublish-validation.json \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-artifact-id 0 \
            --source-commit pending

      - name: Create the ${{ inputs.region }} regional data commit locally
        if: steps.changes.outputs.changed == 'true'
        id: commit
        shell: bash
        env:
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          files=(
            "QFXMythicRankData_${REGION}/Data.lua"
            "QFXMythicRankData_${REGION}/QFXMythicRankData_${REGION}.toc"
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No changes to commit for ${REGION}"
            exit 0
          fi
          git commit -m "Update regional Mythic+ cutoff data (${REGION})"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve publishing source commit
        if: steps.publish_scope.outputs.should_publish == 'true'
        id: source_commit
        shell: bash
        env:
          DATA_CHANGED: ${{ steps.changes.outputs.changed }}
          GENERATED_COMMIT: ${{ steps.commit.outputs.commit_sha }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${DATA_CHANGED}" == "true" ]]; then
            if [[ ! "${GENERATED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Generated commit SHA is invalid." >&2
              exit 1
            fi
            echo "sha=${GENERATED_COMMIT}" >> "${GITHUB_OUTPUT}"
          else
            echo "sha=${WORKFLOW_COMMIT}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload regional package Artifact
        if: steps.publish_scope.outputs.should_publish == 'true'
        id: packages
        uses: actions/upload-artifact@v4
        with:
          name: QFXMythicRankData-package-${{ inputs.region }}-${{ github.run_id }}
          path: dist/*.zip
          retention-days: 5
          if-no-files-found: error

      - name: Upload changed regional package to CurseForge
        if: steps.publish_scope.outputs.should_publish == 'true'
        id: curseforge
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          python scripts/publish_curseforge_auto.py \
            --artifact-dir dist \
            --regions "$(echo "${REGION}" | tr '[:upper:]' '[:lower:]')" \
            --mode upload \
            --changelog-file publish-report/changelog.md \
            --report-file publish-report/report.json \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-artifact-id "${{ steps.packages.outputs.artifact-id }}" \
            --source-commit "${{ steps.source_commit.outputs.sha }}"

      - name: Upload safe CurseForge publishing report
        if: always() && steps.publish_scope.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-publish-report-${{ inputs.region }}-${{ github.run_id }}
          path: publish-report/report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Push published ${{ inputs.region }} data to main (with rebase retry)
        if: steps.changes.outputs.changed == 'true' && steps.curseforge.outcome == 'success'
        shell: bash
        env:
          REGION: ${{ inputs.region }}
          PUBLISH_REF: refs/heads/main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${PUBLISH_REF}"; then
              echo "Pushed ${REGION} regional data."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto latest main..."
            git fetch origin "${PUBLISH_REF}"
            git rebase "origin/${PUBLISH_REF#refs/heads/}" || true
          done
          echo "Failed to push ${REGION} regional data after retries." >&2
          exit 1
