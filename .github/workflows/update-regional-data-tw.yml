name: Update TW Regional Data

on:
  schedule:
    - cron: "4 4 * * *"
      timezone: "Asia/Taipei"
    - cron: "16 16 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even when regional data is unchanged"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-tw:
    uses: ./.github/workflows/region-update-shared.yml
    with:
      region: TW
      force_publish: ${{ inputs.force_publish || false }}
    secrets: inherit
