name: Probe RaiderIO Live 100 Pages

on:
  push:
    branches:
      - probe/raiderio-live-100pages-20260726
    paths:
      - scripts/probe_raiderio_live_100pages.py
      - .github/workflows/probe-raiderio-live-100pages.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Run 100-page Live Tracking coverage probe
        env:
          RAIDERIO_ACCESS_KEY: ${{ secrets.RAIDERIO_ACCESS_KEY }}
        run: python scripts/probe_raiderio_live_100pages.py

      - name: Publish job summary
        if: always()
        run: |
          if [ -f artifacts/raiderio_live_100pages.md ]; then
            cat artifacts/raiderio_live_100pages.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raiderio-live-100pages-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
