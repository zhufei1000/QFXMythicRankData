name: Update US Regional Data

on:
  schedule:
    # US Eastern 16:00 EDT = 20:00 UTC (afternoon snapshot; shifts 1h in winter)
    - cron: "0 20 * * *"
    # US Eastern 04:00 EDT = 08:00 UTC (overnight snapshot; shifts 1h in winter)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even when regional data is unchanged"
        required: true
        type: boolean
        default: false

jobs:
  update-us:
    uses: ./.github/workflows/region-update-shared.yml
    with:
      region: US
      force_publish: ${{ inputs.force_publish || false }}
    secrets: inherit
