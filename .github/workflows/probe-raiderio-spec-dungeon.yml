name: Probe RaiderIO Spec Dungeon Coverage

on:
  push:
    branches:
      - probe/raiderio-spec-dungeon-20260726
    paths:
      - scripts/probe_raiderio_spec_dungeon_v2.py
      - scripts/probe_raiderio_spec_dungeon_v3.py
      - scripts/probe_raiderio_spec_dungeon_v4.py
      - .github/workflows/probe-raiderio-spec-dungeon.yml
  pull_request:
    paths:
      - scripts/probe_raiderio_spec_dungeon_v2.py
      - scripts/probe_raiderio_spec_dungeon_v3.py
      - scripts/probe_raiderio_spec_dungeon_v4.py
      - .github/workflows/probe-raiderio-spec-dungeon.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raiderio-spec-dungeon-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Compile fixed sample probe
        run: |
          python -m py_compile scripts/probe_raiderio_spec_dungeon_v2.py
          python -m py_compile scripts/probe_raiderio_spec_dungeon_v4.py

      - name: Run fixed ten-sample mainstream talent probe
        env:
          RAIDERIO_ACCESS_KEY: ${{ secrets.RAIDERIO_ACCESS_KEY }}
        run: python scripts/probe_raiderio_spec_dungeon_v4.py

      - name: Publish job summary
        if: always()
        run: |
          if [ -f artifacts/raiderio_mainstream_talents_v4.md ]; then
            cat artifacts/raiderio_mainstream_talents_v4.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f artifacts/raiderio_mainstream_talents_checkpoint_v4.json ]; then
            echo "# Fixed ten-sample Raider.IO probe checkpoint" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("artifacts/raiderio_mainstream_talents_checkpoint_v4.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"\n- Elapsed: {d['elapsed_seconds']} seconds\n")
              f.write(f"- Completed specs: {len(d['completed_specs'])}/40\n")
              f.write(f"- Current spec: {d['current_spec'] or 'none'}\n")
              f.write(f"- HTTP requests: {d['http_requests']}\n")
          PY
          fi

      - name: Upload result and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raiderio-mainstream-talents-v4-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
