name: Probe Blizzard CN profile endpoints (isolated no-secrets)

on:
  push:
    branches:
      - probe/raiderio-cn-gear-20261008
    paths:
      - .github/workflows/probe-blizzard-cn-profile-20261008.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
    steps:
      - name: Test global vs CN OAuth and inspect public character APIs
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          cid=os.environ.get("BLIZZARD_CLIENT_ID","").strip()
          secret=os.environ.get("BLIZZARD_CLIENT_SECRET","").strip()
          configured=bool(cid and secret)
          print("SECRETS_CONFIGURED",configured,flush=True)
          if not configured:
              print("TEST_RESULT NOT_CONFIGURED",flush=True)
              raise SystemExit(0)

          def token(endpoint):
              authorization=base64.b64encode((cid+":"+secret).encode()).decode()
              request=urllib.request.Request(endpoint,
                data=urllib.parse.urlencode({"grant_type":"client_credentials"}).encode(),
                headers={"Authorization":"Basic "+authorization,"Content-Type":"application/x-www-form-urlencoded","User-Agent":"QFXGearInspect-OAuthTest/1.0"},
                method="POST")
              try:
                  with urllib.request.urlopen(request,timeout=14) as res:
                      payload=json.load(res)
                      access_token=payload.get("access_token")
                      print("OAUTH",endpoint,"HTTP",res.status,"HAS_TOKEN",bool(access_token),flush=True)
                      return access_token
              except urllib.error.HTTPError as exc:
                  print("OAUTH",endpoint,"HTTP",exc.code,flush=True)
              except Exception as exc:
                  print("OAUTH",endpoint,"ERROR",type(exc).__name__,flush=True)
              return None

          global_token=token("https://oauth.battle.net/token")
          cn_token=token("https://oauth.battlenet.com.cn/token")
          if cn_token is None:
              cn_token=token("https://oauth.battle.net.cn/token")

          def inspect(label,api_url,bearer):
              if not bearer:
                  print("API",label,"SKIP_NO_TOKEN",flush=True)
                  return
              request=urllib.request.Request(api_url,headers={"Authorization":"Bearer "+bearer,"Accept":"application/json","User-Agent":"QFXGearInspect-OAuthTest/1.0"})
              try:
                  with urllib.request.urlopen(request,timeout=14) as response:
                      body=json.load(response)
                      print("API",label,"HTTP",response.status,"KEYS",list(body.keys())[:24],flush=True)
                      if isinstance(body.get("equipped_items"),list):
                          print("EQUIPPED_ITEMS_COUNT",label,len(body["equipped_items"]),flush=True)
                      if "mastery" in body or "versatility" in body:
                          for k in ("melee_crit","ranged_crit","spell_crit","melee_haste","spell_haste","mastery","versatility"):
                              v=body.get(k)
                              if isinstance(v,dict):
                                  print("STAT",label,k,{key:v.get(key) for key in ("rating","rating_bonus","value") if key in v},flush=True)
              except urllib.error.HTTPError as exc:
                  print("API",label,"HTTP",exc.code,flush=True)
              except Exception as exc:
                  print("API",label,"ERROR",type(exc).__name__,flush=True)

          cn_char="https://gateway.battlenet.com.cn/profile/wow/character/shadowfang-keep/"+urllib.parse.quote("质量有保证")
          us_char="https://us.api.blizzard.com/profile/wow/character/tichondrius/vesphorous"
          inspect("US_CONTROL_EQUIPMENT",us_char+"/equipment?namespace=profile-us&locale=en_US",global_token)
          for auth_label,auth_token in (("CN_OAUTH",cn_token),("GLOBAL_OAUTH",global_token)):
              inspect("CN_EQUIPMENT_"+auth_label,cn_char+"/equipment?namespace=profile-cn&locale=zh_CN",auth_token)
              inspect("CN_STATISTICS_"+auth_label,cn_char+"/statistics?namespace=profile-cn&locale=zh_CN",auth_token)
          print("TEST_DONE",flush=True)
          PY
