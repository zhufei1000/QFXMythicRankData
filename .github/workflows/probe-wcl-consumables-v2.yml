name: Validate WCL pull-time flasks and food (one-off)

on:
  pull_request:
    paths:
      - "scripts/probe_wcl_consumables_v2.py"
      - "tests/test_probe_wcl_consumables_v2.py"
      - ".github/workflows/probe-wcl-consumables-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test v2 parsers
        run: python -m pytest -q tests/test_probe_wcl_consumables_v2.py tests/test_probe_wcl_consumables_v1.py
      - name: One small live WCL sample (3 raid + 3 M+)
        id: sample
        shell: bash
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_REQUEST_DELAY: "0.15"
        run: |
          set +e
          python scripts/probe_wcl_consumables_v2.py --target 3 \
            --max-seconds 150 --output artifacts/wcl_consumables_v2.json
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os
          p = pathlib.Path('artifacts/wcl_consumables_v2.json')
          lines = ['## Pull-time Flask / Food detection','']
          if p.exists():
              doc = json.loads(p.read_text(encoding='utf-8'))
              lines += ['Status: '+doc['status'],
                        'Requests: '+str(doc['requests']),
                        'Seconds: '+str(doc['elapsed_seconds']),'',
                        '| Mode | Actors | Flask from pull snapshot | Food from pull snapshot | Flask from Buffs table | Food from Buffs table |',
                        '|---|---:|---:|---:|---:|---:|']
              for mode, v in doc['modes'].items():
                  c = v['player_counts']
                  lines.append('| {} | {} | {} | {} | {} | {} |'.format(
                      mode,v['actor_matched'],
                      c.get('pull_flask_confirmed_id',0),c.get('pull_food_buff',0),
                      c.get('table_flask_confirmed_id',0),c.get('table_food_buff',0)))
          else:
              lines.append('Failed before first checkpoint, inspect job log')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wcl-consumables-v2-${{ github.run_id }}
          path: artifacts/wcl_consumables_v2.json
          retention-days: 3
          if-no-files-found: warn
      - name: Require successful probe
        if: steps.sample.outputs.exit_code != '0'
        run: exit 1
