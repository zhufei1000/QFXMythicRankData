name: Collect gear recommendations (manual internal validation)
on:
  workflow_dispatch:
    inputs:
      test_data:
        description: Generate 40-spec synthetic fixtures without WCL requests
        type: boolean
        default: true
      specs:
        description: Comma-separated SpecIDs; validate Arms first, keep batches small
        default: '71'
        required: true
      mode:
        description: Gameplay mode
        type: choice
        options: [both, mythic_plus, raid]
        default: both
      target:
        description: Valid unique characters per spec/mode (1 to 50)
        default: '50'
      checkpoint_run:
        description: Prior run ID to resume (same scope, expires after 3 days)
        default: ''
      recipient_public_key:
        description: Base64 RSA public key for encrypted internal real-data results
        default: ''
      max_pages:
        description: Maximum ranking pages per encounter (fallback for both modes)
        default: '10'
      max_pages_raid:
        description: Maximum raid ranking pages
        default: '10'
      max_pages_mythic_plus:
        description: Maximum Mythic+ ranking pages (keystone-sorted, fewer needed)
        default: '6'
      max_cast_pages:
        description: Maximum consumable cast pages per sample (page 0 covers flask/food)
        default: '2'
      quota_reserve:
        description: Fraction of hourly points kept unused (0.15 to 0.5)
        default: '0.25'
permissions:
  contents: read
  actions: read
concurrency:
  group: qfx-gear-manual
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install cryptography
      - name: Public metadata cache date
        id: metadata-date
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Cache public item metadata only
        uses: actions/cache@v4
        with:
          path: .gear-metadata
          key: gear-public-metadata-${{ runner.os }}-${{ steps.metadata-date.outputs.day }}-${{ hashFiles('config/gear_season.json', 'config/gear_specs.json') }}
      - name: Verify collector and statistics
        run: python -m pytest -q tests/test_gear_recommendations.py
      - name: Resume private checkpoint
        if: inputs.test_data == false && github.event.repository.private && inputs.checkpoint_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.checkpoint_run }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$RUN_ID" --name qfx-gear-checkpoint --dir artifacts/gear
      - name: Collect bounded batch using existing WCL secrets
        id: collect
        if: inputs.test_data == false
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          SPECS: ${{ inputs.specs }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_PAGES_RAID: ${{ inputs.max_pages_raid }}
          MAX_PAGES_MYTHIC_PLUS: ${{ inputs.max_pages_mythic_plus }}
          MAX_CAST_PAGES: ${{ inputs.max_cast_pages }}
          QUOTA_RESERVE: ${{ inputs.quota_reserve }}
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          INTERNAL_CHECKPOINT: ${{ secrets.QFX_GEAR_TEST_CHECKPOINT }}
        run: |
          mkdir -p artifacts/gear
          python -c 'import os,base64,pathlib; from cryptography.hazmat.primitives import serialization; p=pathlib.Path("artifacts/gear/recipient.pem"); p.write_bytes(base64.b64decode(os.environ["RECIPIENT_PUBLIC_KEY"])); serialization.load_pem_public_key(p.read_bytes())'
          python -c 'import os,base64,zlib,pathlib; data=os.environ.get("INTERNAL_CHECKPOINT"); data and pathlib.Path("artifacts/gear/checkpoint.json").write_bytes(zlib.decompress(base64.b64decode(data)))'
          set +e
          python scripts/collect_gear_recommendations.py --specs "$SPECS" --mode "$MODE" --target "$TARGET" --max-tasks 6 --max-seconds 780 --max-pages "$MAX_PAGES" --max-pages-raid "${MAX_PAGES_RAID:-$MAX_PAGES}" --max-pages-mythic-plus "${MAX_PAGES_MYTHIC_PLUS:-6}" --max-cast-pages "${MAX_CAST_PAGES:-2}" --quota-reserve "$QUOTA_RESERVE" --internal-test
          echo "result=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Generate clearly labeled synthetic fixtures
        if: inputs.test_data
        run: |
          python scripts/generate_gear_mock_data.py --output-dir artifacts/gear
          mv artifacts/gear/mock-recommendations.json artifacts/gear/recommendations.json
          python -c 'import json,pathlib; p=pathlib.Path("artifacts/gear"); d=json.loads((p/"recommendations.json").read_text()); (p/"diagnostics.json").write_text(json.dumps(d["mockDiagnostics"]))'
      - name: Build internal test addons
        if: always()
        run: |
          if test -f artifacts/gear/recommendations.json; then
            python scripts/build_gear_databases.py --input artifacts/gear/recommendations.json --internal-test
          fi
      - name: Encrypt real test results for the local recipient
        if: always() && inputs.test_data == false
        run: |
          if test -f artifacts/gear/checkpoint.json && test -f artifacts/gear/recipient.pem; then
            python scripts/gear_private_transfer.py encrypt --directory artifacts/gear --key artifacts/gear/recipient.pem --output artifacts/encrypted/gear-test.enc.json
          fi
      - name: Upload encrypted real test results
        if: always() && inputs.test_data == false
        uses: actions/upload-artifact@v4
        with:
          name: qfx-gear-encrypted-test
          path: artifacts/encrypted/gear-test.enc.json
          retention-days: 1
          if-no-files-found: warn
      - name: Upload anonymous diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qfx-gear-diagnostics
          path: artifacts/gear/diagnostics.json
          retention-days: 3
          if-no-files-found: warn
      - name: Upload synthetic test data
        if: always() && inputs.test_data
        uses: actions/upload-artifact@v4
        with:
          name: qfx-gear-validation
          path: |
            artifacts/gear/recommendations.json
            artifacts/gear/QFXRecommendationData-internal.zip
          retention-days: 3
          if-no-files-found: warn
      - name: Mark incomplete collection honestly
        if: inputs.test_data == false && steps.collect.outputs.result != '0'
        run: exit 1
