name: Update EU Regional Data

on:
  schedule:
    # EU Central: 18:00 CET / 19:00 CEST = 17:00 UTC.
    # This keeps at least a ~2h buffer after the 16:00 local boundary year-round.
    - cron: "0 17 * * *"
    # EU Central: 06:00 CET / 07:00 CEST = 05:00 UTC.
    # This keeps at least a ~2h buffer after the 04:00 local boundary year-round.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even when regional data is unchanged"
        required: true
        type: boolean
        default: false

jobs:
  update-eu:
    uses: ./.github/workflows/region-update-shared.yml
    with:
      region: EU
      force_publish: ${{ inputs.force_publish || false }}
    secrets: inherit
