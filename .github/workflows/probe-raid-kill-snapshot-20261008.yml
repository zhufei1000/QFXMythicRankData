name: Probe RaiderIO raid kill snapshot schema 2026

on:
  push:
    branches:
      - probe/raiderio-cn-gear-20261008
    paths:
      - .github/workflows/probe-raid-kill-snapshot-20261008.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public API schema (no scraping or login)
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"GearInspect-Authorized-APISchemaProbe/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=18) as r: return json.load(r)
          spec=get("https://raider.io/swagger.json")
          print("SWAGGER_VERSION",spec.get("info",{}).get("version"))
          paths=spec.get("paths") or {}
          for path in [
            "/api/v1/raiding/static-data",
            "/api/v1/raiding/raid-rankings",
            "/api/v1/live-tracking/guild/boss-pulls",
            "/api/v1/live-tracking/guild/raid-pulls",
            "/api/v1/live-tracking/guild/raid-comps",
            "/api/v1/live-tracking/character/loadout",
          ]:
              cfg=paths.get(path) or {}
              operation=cfg.get("get") or {}
              print("ENDPOINT",path,"parameters",[(p.get("name"),p.get("required"),p.get("type"),p.get("default")) for p in operation.get("parameters",[])],flush=True)
              print("DESCRIPTION",str(operation.get("summary") or operation.get("description") or "")[:180],flush=True)
              responses=operation.get("responses") or {}
              print("RESPONSE_SCHEMA",str((responses.get("200") or {}).get("schema") or "")[:160],flush=True)
          try:
              data=get("https://raider.io/api/v1/raiding/static-data?expansion_id=11")
              raids=data.get("raids") if isinstance(data,dict) else None
              print("STATIC_ROOT_KEYS",list(data)[:25],"RAID_COUNT",len(raids or []),flush=True)
              for raid in (raids or [])[-6:]:
                  print("RAID_META",{k:raid.get(k) for k in ("slug","name","id","tier","is_current")},flush=True)
          except Exception as e: print("STATIC_FAIL",repr(e)[:240])
          PY

      - name: Probe one CN guild raid kill roster from public endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          BASE="https://raider.io"
          def req(path,p):
              url=BASE+path+"?"+urllib.parse.urlencode(p)
              request=urllib.request.Request(url,headers={"User-Agent":"GearInspect-RaidSnapshotProof/1.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(request,timeout=19) as response:return response.status,json.load(response)
              except urllib.error.HTTPError as e: return e.code,{"error":e.read(180).decode("utf-8","replace")}
              except Exception as e: return -1,{"error":str(e)[:90]}
          def shape(x):
              if isinstance(x,dict):
                  return {k:("list:"+str(len(v)) if isinstance(v,list) else "dict:"+str(list(v)[:15]) if isinstance(v,dict) else str(v)[:70]) for k,v in list(x.items())[:25]}
              if isinstance(x,list):
                  return {"list_length":len(x),"first":shape(x[0]) if x else None}
              return str(x)[:100]
          rstatus,static=req("/api/v1/raiding/static-data",{"expansion_id":11})
          rs=next((x for x in static.get("raids",[]) if x.get("slug")=="the-venomous-abyss"),None)
          print("RAID_STATIC",rstatus,shape(rs),flush=True)
          for difficulty in ("mythic","heroic"):
              status,rank=req("/api/v1/raiding/raid-rankings",{"raid":"the-venomous-abyss","difficulty":difficulty,"region":"cn","page":0,"limit":10})
              print("RANK",difficulty,"HTTP",status,"TOP",shape(rank),flush=True)
              print("RANK_NESTED",difficulty,shape(rank.get("rankings")),flush=True)
          PY

      - name: Inspect one CN guild real boss-kill records and raid comps response
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error
          BASE="https://raider.io"
          def req(path,p):
              url=BASE+path+"?"+urllib.parse.urlencode(p)
              try:
                  r=urllib.request.Request(url,headers={"User-Agent":"GearInspect-CN-Raid-Kill-Verification/1.0","Accept":"application/json"})
                  with urllib.request.urlopen(r,timeout=16) as f:return f.status,json.load(f)
              except urllib.error.HTTPError as e:return e.code,{"error":e.read(150).decode("utf-8","replace")}
              except Exception as e:return -1,{"error":repr(e)[:100]}
          def view(x):
              if isinstance(x,dict): return {k:("list:"+str(len(v)) if isinstance(v,list) else "dict:"+str(list(v)[:25]) if isinstance(v,dict) else str(v)[:100]) for k,v in list(x.items())[:40]}
              if isinstance(x,list):return {"length":len(x),"first":view(x[0]) if x else None}
              return str(x)[:150]
          raid="the-venomous-abyss";difficulty="mythic"
          _,st=req("/api/v1/raiding/static-data",{"expansion_id":11})
          meta=next((a for a in st.get("raids",[]) if a.get("slug")==raid),{})
          bosses=[x.get("slug") for x in meta.get("encounters",[]) if isinstance(x,dict)]
          print("BOSSES",bosses,flush=True)
          status,ranks=req("/api/v1/raiding/raid-rankings",{"raid":raid,"difficulty":difficulty,"region":"cn","limit":5,"page":0})
          print("CN_RANK",status,"FIRST",view((ranks.get("raidRankings") or [None])[0]),flush=True)
          for i,entry in enumerate((ranks.get("raidRankings") or [])[:2]):
              guild=entry.get("guild") or {}
              server=guild.get("realm") or {}
              region=guild.get("region") or {}
              print("GUILD_ENTRY",i,"DETAIL",view(guild),flush=True)
              realm=server.get("slug") if isinstance(server,dict) else server
              regionv=region.get("slug") if isinstance(region,dict) else region
              name=guild.get("name")
              if not (realm and name):continue
              print("SELECTED_GUILD",realm,name,"region",regionv,flush=True)
              for boss in bosses[:3]:
                  status,pulls=req("/api/v1/live-tracking/guild/boss-pulls",{"raid":raid,"boss":boss,"difficulty":difficulty,"region":"cn","realm":realm,"guild":name})
                  print("BOSS_PULLS",boss,"HTTP",status,"ROOT",view(pulls),flush=True)
                  for k,v in pulls.items():
                      if isinstance(v,list) and v:
                          print("PULL_FIRST",boss,k,view(v[0]),flush=True)
              break
          PY

      - name: Verify success-only CN raidcomp individual gear fields
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error
          BASE="https://raider.io"
          def req(path,p):
              url=BASE+path+"?"+urllib.parse.urlencode(p)
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"GearInspect-KillOnly-RaidComp/1.0","Accept":"application/json"})
                  with urllib.request.urlopen(request,timeout=19) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:return e.code,{"error":e.read(250).decode("utf-8","replace")}
              except Exception as e:return -1,{"error":repr(e)[:160]}
          p={"raid":"the-venomous-abyss","boss":"nekzali-the-soulcoiler","difficulty":"mythic","region":"cn","realm":"scarlet-crusade","guild":"中洲队"}
          status,pulls=req("/api/v1/live-tracking/guild/boss-pulls",p)
          kills=[]
          for row in pulls.get("pulls",[]):
              detail=row.get("details") or {}
              if detail.get("is_success") is True:
                  kills.append(detail)
          print("PULL_RESULT","HTTP",status,"total",len(pulls.get("pulls",[])),"successful",len(kills),flush=True)
          if not kills:raise SystemExit(0)
          d=kills[-1]
          print("KILL_ID",d.get("id"),"RAIDCOMP_URL_PRESENT",bool(d.get("raidcomp_url")),"MEMBER_COUNT",d.get("num_members"),flush=True)
          queries=[
              {"raid":p["raid"],"id":d.get("id"),"difficulty":p["difficulty"],"region":p["region"],"realm":p["realm"],"guild":p["guild"]},
              {"raid":p["raid"],"id":d.get("id"),"guild_id":2373274},
          ]
          for i,qp in enumerate(queries):
              status,comp=req("/api/v1/live-tracking/guild/raid-comps",qp)
              print("RAIDCOMP",i,"HTTP",status,"ROOT_KEYS",list(comp.keys())[:35],flush=True)
              for key,v in comp.items():
                  if isinstance(v,list):
                      print("LIST",i,key,"COUNT",len(v),"ENTRY_KEYS",list(v[0].keys())[:45] if v and isinstance(v[0],dict) else [],flush=True)
                      if v and isinstance(v[0],dict):
                          member=v[0]; print("FIRST_MEMBER_SUMMARY",i,{k:str(value)[:90] for k,value in member.items() if k in ("name","spec","spec_id","class","character","gear","loadout","items")},flush=True)
                          for mk,mv in member.items():
                              if isinstance(mv,dict) and ("gear" in mk.lower() or "loadout" in mk.lower()):
                                  print("GEAR_SHAPE",i,mk,list(mv.keys())[:28],flush=True)
                                  items=mv.get("items") or mv.get("equipped_items")
                                  if isinstance(items,dict):
                                      key, value=next(iter(items.items()),(None,None))
                                      print("GEAR_FIRST_SLOT",key,list(value.keys())[:32] if isinstance(value,dict) else str(value)[:150],flush=True)
              if status!=200:print("COMP_ERROR",i,str(comp)[:180],flush=True)
          PY
