name: Probe CN Arms leaderboard to 20 gear profiles

on:
  push:
    branches: [probe/raiderio-cn-gear-20261008]
    paths: [.github/workflows/probe-cn-arms-20-20261008.yml]

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query CN leaderboard and validate up to 20 distinct gear profiles
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import time
          import urllib.parse
          import urllib.request
          import urllib.error

          def request(endpoint,query,timeout=17):
              url=endpoint+"?"+urllib.parse.urlencode(query)
              req=urllib.request.Request(url,headers={"User-Agent":"GearInspect-CN20-Probe/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=timeout) as resp: return json.load(resp)
          def active_season(seasons):
              now=datetime.datetime.now(datetime.timezone.utc)
              found=[]
              for s in seasons:
                  try:
                      starts=[datetime.datetime.fromisoformat(str(t).replace("Z","+00:00")) for t in (s.get("starts") or {}).values() if t]
                      ends=[datetime.datetime.fromisoformat(str(t).replace("Z","+00:00")) for t in (s.get("ends") or {}).values() if t]
                      if (not starts or min(starts)<=now) and (not ends or max(ends)>=now):
                          found.append(s)
                  except Exception: pass
              found.sort(key=lambda s:bool(s.get("is_main_season")),reverse=True)
              return (found or [s for s in seasons if s.get("is_main_season")] or seasons)[-1 if not found else 0]

          static=request("https://raider.io/api/v1/mythic-plus/static-data",{"expansion_id":11})
          season=active_season(static.get("seasons") or {}).get("slug")
          print("ACTIVE_SEASON",season,flush=True)
          data=request("https://raider.io/api/mythic-plus/rankings/specs",{"region":"cn","class":"warrior","spec":"arms","season":season,"page":0,"pageSize":100})
          ranks=(data.get("rankings") or {}).get("rankedCharacters") or []
          print("CN_ARMS_RANKING_ROWS",len(ranks),"response_keys",list(data.keys()),flush=True)
          seen=set()
          successes=0
          attempts=0
          wrong_spec=0
          errors=0
          samples=[]
          for row in ranks:
              char=row.get("character") or {}
              name=char.get("name")
              realm=(char.get("realm") or {})
              slug=realm.get("slug") or realm.get("name")
              key=(str(slug).lower(),str(name).lower())
              if not slug or not name or key in seen: continue
              seen.add(key)
              attempts+=1
              try:
                  player=request("https://raider.io/api/v1/characters/profile",{"region":"cn","realm":slug,"name":name,"fields":"gear"})
                  gear=player.get("gear") or {}
                  items=gear.get("items") or {}
                  ids=[v.get("item_id") for slot,v in items.items() if isinstance(v,dict) and isinstance(v.get("item_id"),int) and slot not in ("shirt","tabard")]
                  spec=player.get("active_spec_name")
                  valid=len(ids)>=10
                  correct_spec=(not spec) or spec.strip().casefold()=="arms"
                  if valid and correct_spec:
                      successes+=1
                      if len(samples)<6: samples.append({"realm":slug,"gear_slots":len(ids),"first_3_itemids":ids[:3],"ilvl":gear.get("item_level_equipped")})
                  if valid and not correct_spec: wrong_spec+=1
                  if attempts<=6 or attempts%10==0:
                      print("CANDIDATE",attempts,"ids",len(ids),"spec",spec,"accepted",valid and correct_spec,flush=True)
              except urllib.error.HTTPError as exc:
                  errors+=1
                  if errors<=4: print("HTTP_ERROR",exc.code,flush=True)
              except Exception as exc:
                  errors+=1
                  if errors<=4: print("NETWORK_ERROR",type(exc).__name__,str(exc)[:130],flush=True)
              if successes>=20 or attempts>=35: break
              time.sleep(.1)
          print("TOTAL",json.dumps({"cn_ranking_candidates":len(ranks),"attempts":attempts,"successful_arms_gear_profiles":successes,"wrong_current_spec":wrong_spec,"request_errors":errors,"samples":samples},ensure_ascii=False),flush=True)
          print("GO_NO_GO_CN_ARMS_20", "PASS" if successes>=20 else "INCOMPLETE",flush=True)
          PY
