name: Probe public CN Armory website API (isolated)

on:
  push:
    branches: [probe/raiderio-cn-gear-20261008]
    paths: [.github/workflows/probe-public-cn-armory-20261008.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe two documented publicly visible CN Armory website requests
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          host="https://webapi.blizzard.cn/wow-armory-server/api/"
          cases=[
             ("SERVER_STATUS","server_status",{"server_type":"wow_mainline"}),
             ("PUBLIC_CHARACTER_INDEX","index",{"realm_slug":"shadowfang-keep","role_name":"质量有保证"}),
          ]
          def mask(k):
              if "token" in k.lower() or "auth" in k.lower() or "cookie" in k.lower(): return "<REDACTED>"
              return k
          for label, path, args in cases:
              url=host+path+"?"+urllib.parse.urlencode(args)
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; GearInspect-CN-Armory-Probe/1.0)","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as response:
                      payload=response.read(250000)
                      status=response.status
                  print("CASE",label,"HTTP",status,"CONTENT_TYPE",response.headers.get("Content-Type"),flush=True)
                  try:
                      data=json.loads(payload)
                      if isinstance(data,dict):
                          print("JSON",label,"RESPONSE_CODE",data.get("code"),"ROOT_KEYS",[mask(x) for x in data.keys()],flush=True)
                          value=data.get("data")
                          if isinstance(value,dict):
                              print("DATA_KEYS",label,[mask(x) for x in value.keys()][:45],flush=True)
                              summary=value.get("character_summary")
                              if isinstance(summary,dict):
                                  print("CHARACTER_SUMMARY_KEYS",label,[mask(x) for x in summary.keys()][:45],flush=True)
                              print("HAS_CHARACTER_TOKEN",label,bool(value.get("token")),flush=True)
                          if isinstance(value,list):print("DATA_ROWS",label,len(value),flush=True)
                      else:print("JSON_TYPE",label,type(data).__name__,flush=True)
                  except json.JSONDecodeError:
                      print("NOT_JSON",label,"BODY_BYTES",len(payload),flush=True)
              except urllib.error.HTTPError as exc:
                  print("CASE",label,"HTTP",exc.code,flush=True)
              except Exception as exc:
                  print("CASE",label,"ERROR",type(exc).__name__,str(exc)[:140],flush=True)
          PY
