name: Update TW Regional Data

on:
  schedule:
    # TW 18:00 CST = 10:00 UTC (final daytime snapshot, ~2h after the 16:00 boundary)
    - cron: "0 10 * * *"
    # TW 06:00 CST = 22:00 UTC (final overnight snapshot, ~2h after the 04:00 boundary)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even when regional data is unchanged"
        required: true
        type: boolean
        default: false

jobs:
  update-tw:
    uses: ./.github/workflows/region-update-shared.yml
    with:
      region: TW
      force_publish: ${{ inputs.force_publish || false }}
    secrets: inherit
