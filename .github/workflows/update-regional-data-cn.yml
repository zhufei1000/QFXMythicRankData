name: Update CN Regional Data

on:
  schedule:
    - cron: "4 4 * * *"
      timezone: "Asia/Shanghai"
    - cron: "16 16 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even when regional data is unchanged"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-cn:
    uses: ./.github/workflows/region-update-shared.yml
    with:
      region: CN
      force_publish: ${{ inputs.force_publish || false }}
    secrets: inherit
