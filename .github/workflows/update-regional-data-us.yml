name: Update US Regional Data

on:
  schedule:
    # Run once daily at 06:18 regional local time.
    - cron: "18 6 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even when regional data is unchanged"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-us:
    uses: ./.github/workflows/region-update-shared.yml
    with:
      region: US
      force_publish: ${{ inputs.force_publish || false }}
    secrets: inherit
