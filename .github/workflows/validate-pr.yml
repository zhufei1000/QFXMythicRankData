name: Validate Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install Lua 5.1
        uses: ./.github/actions/setup-lua51

      - name: Compile talent pipeline
        run: |
          python -m py_compile \
            scripts/collect_mythicplus_talents.py \
            scripts/collect_raid_talents.py \
            scripts/build_talent_data.py \
            scripts/build_talent_data_v2.py \
            scripts/probe_raiderio_spec_dungeon_v2.py \
            scripts/probe_raiderio_spec_dungeon_v4.py \
            scripts/probe_wcl_raid_talents_v1.py \
            scripts/wcl_talent_export.py \
            scripts/talent_statistics.py \
            scripts/publish_talent_curseforge.py

      - name: Verify shared Core.lua synchronization
        run: python scripts/sync_core.py --check

      - name: Run test suite
        env:
          LUA51: /usr/local/bin/lua
        run: python -m pytest -v

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          luac -p shared/Core.lua
          for region in CN US EU TW KR; do
            luac -p "QFXMythicRankData_${region}/Core.lua"
            luac -p "QFXMythicRankData_${region}/Data.lua"
          done
          find \
            QFXTalentData \
            QFXTalentData_MythicPlus \
            QFXTalentData_RaidHeroic \
            QFXTalentData_RaidMythic \
            -name '*.lua' -print0 | xargs -0 -n1 luac -p

      - name: Build all regional packages
        run: python scripts/build_packages.py
