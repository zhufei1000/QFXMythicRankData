name: ChatGPT Export QFXTalentData

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-export-qfx-talent-data.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package current committed database
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## Version: //p' QFXTalentData/QFXTalentData.toc)"
          package="QFXTalentData-${version}.zip"
          rm -f "${package}"
          zip -9 -r "${package}" \
            QFXTalentData \
            QFXTalentData_MythicPlus \
            QFXTalentData_RaidHeroic \
            QFXTalentData_RaidMythic
          sha256sum "${package}" | tee QFXTalentData-export-sha256.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > QFXTalentData-export-run-id.txt
          printf '%s\n' "${version}" > QFXTalentData-export-version.txt
          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Upload package artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: QFXTalentData-export-${{ github.run_id }}
          path: ${{ steps.package.outputs.package }}
          retention-days: 5
          if-no-files-found: error

      - name: Commit export locator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QFXTalentData-export-run-id.txt QFXTalentData-export-version.txt QFXTalentData-export-sha256.txt
          git commit -m "Export QFXTalentData ${{ steps.package.outputs.version }} [skip ci]"
          git push origin HEAD:main
